        const tbody = document.getElementById('dictionary-body');
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        const noResults = document.getElementById('no-results');
        const totalCountEl = document.getElementById('total-count');

        function renderTable(data) {
            tbody.innerHTML = '';
            if (data.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                data.forEach((item) => {
                    const tr = document.createElement('tr');
                    tr.className = 'table-row-hover transition-colors border-b border-gray-800/40 cursor-pointer';
                    tr.onclick = () => copyRow(item);

                    tr.innerHTML = `
                        <td class="py-3.5 px-4 text-center text-xs font-mono text-gray-500">${item.id}</td>
                        <td class="py-3.5 px-4 font-semibold text-indigo-200">${escapeHtml(item.tapong)}</td>
                        <td class="py-3.5 px-4 text-gray-300">${escapeHtml(item.english)}</td>
                        <td class="py-3.5 px-4 text-slate-200 font-myanmar">${escapeHtml(item.myanmar)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function filterData(searchTerm) {
            const term = searchTerm.toLowerCase().trim();
            if (!term) {
                clearBtn.classList.add('hidden');
                renderTable(dictionaryData);
                return;
            }

            clearBtn.classList.remove('hidden');
            const filtered = dictionaryData.filter(item => 
                item.tapong.toLowerCase().includes(term) ||
                item.english.toLowerCase().includes(term) ||
                item.myanmar.toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        function setFilter(term) {
            searchInput.value = term;
            filterData(term);
        }

        function copyRow(item) {
            const textToCopy = `${item.tapong} = ${item.english} / ${item.myanmar}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(`Copied: ${item.tapong}`);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }

        searchInput.addEventListener('input', (e) => filterData(e.target.value));

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterData('');
            searchInput.focus();
        });

        // Initial Render
        renderTable(dictionaryData);
    </script>
